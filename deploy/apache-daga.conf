# Apache reverse proxy → Next.js DAGA (PM2) di 127.0.0.1:3001.
#
# CUTOVER PENUH: DAGA memegang DOMAIN UTAMA. Laravel lama DIMATIKAN
# (vhost `tidore.conf` & `tidore-ssl.conf` di-a2dissite oleh deploy.sh --cutover).
#
# Alur SSL:
#   1) vhost :80 ini dipasang lebih dulu (DNS sudah menunjuk ke server ini),
#   2) `certbot --apache -d disdukcapil.tidorekota.go.id -d www...` → certbot
#      MEMBUAT sendiri vhost SSL (`daga-le-ssl.conf`) dengan menyalin direktif
#      proxy di bawah, lalu menambah redirect :80 → :443.
#
# Pasang (dilakukan deploy.sh --cutover):
#   a2enmod proxy proxy_http headers
#   cp apache-daga.conf /etc/apache2/sites-available/daga.conf
#   a2ensite daga && apache2ctl configtest && systemctl reload apache2
#
# ⚠️ Berkas ini hanya menyetir vhost :80. Vhost HTTPS yang benar-benar melayani
# warga adalah `daga-le-ssl.conf` buatan certbot — perubahan di sini TIDAK ikut
# ke sana dengan sendirinya. Setiap penambahan (mis. blok /antrian di bawah)
# harus disisipkan juga ke daga-le-ssl.conf. Lihat deploy/RUNBOOK-ANTRIAN-PROXY.md.
<VirtualHost *:80>
    ServerName disdukcapil.tidorekota.go.id
    ServerAlias www.disdukcapil.tidorekota.go.id

    # ACME challenge WAJIB dilayani dari disk — jangan di-proxy ke Node,
    # kalau tidak certbot gagal memverifikasi domain.
    ProxyPass /.well-known/acme-challenge !
    Alias /.well-known/acme-challenge /var/www/certbot/.well-known/acme-challenge
    <Directory /var/www/certbot/.well-known/acme-challenge>
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyRequests Off

    # --- Antrian loket → 127.0.0.1:3000 (APLIKASI TERPISAH) -----------------
    # /antrian BUKAN rute DAGA. Ia dilayani aplikasi antrian-dukcapil yang
    # berdiri sendiri (pm2 `antrian`, /var/www/antrian, PostgreSQL sendiri).
    # Portal cuma menautkannya dari navbar (NEXT_PUBLIC_ANTRIAN_URL).
    #
    # ⚠️ URUTAN MENENTUKAN: Apache memakai aturan ProxyPass yang cocok PERTAMA.
    # Blok ini WAJIB di atas `ProxyPass / …:3001/`; kalau di bawah, /antrian
    # tertelan DAGA dan aplikasi antrian tidak pernah terpanggil.
    #
    # Butuh modul: a2enmod proxy_wstunnel  (untuk ws:// di bawah)
    #
    # Socket.IO memakai DUA moda pada path yang sama: mula-mula HTTP
    # long-polling, lalu naik ke WebSocket. Dua aturan di bawah memisahkannya
    # lewat header `Upgrade`. Tanpa ini, papan monitor & halaman status warga
    # tersambung lalu putus berulang (indikator "Langsung" tak pernah menyala).
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/antrian/socket\.io/(.*) ws://127.0.0.1:3000/antrian/socket.io/$1 [P,L]
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule ^/antrian/socket\.io/(.*) http://127.0.0.1:3000/antrian/socket.io/$1 [P,L]

    ProxyPass        /antrian http://127.0.0.1:3000/antrian retry=0 timeout=90
    ProxyPassReverse /antrian http://127.0.0.1:3000/antrian
    # --- akhir blok Antrian --------------------------------------------------

    ProxyPass        / http://127.0.0.1:3001/ retry=0 timeout=90
    ProxyPassReverse / http://127.0.0.1:3001/
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port  "80"

    # Unggah KTP/KK & Excel demografi (12 MB)
    LimitRequestBody 13107200

    ErrorLog  ${APACHE_LOG_DIR}/daga_error.log
    CustomLog ${APACHE_LOG_DIR}/daga_access.log combined
</VirtualHost>
